# Bouwt bij elke push de Engelse site (/en/) uit de Nederlandse pagina's
# en zet de complete site live op GitHub Pages.
name: Build English site & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # om nieuwe vertalingen (i18n/en.json) terug te committen
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: Generate English pages
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: python3 i18n/build.py

      - name: Save new translations to the repository
        run: |
          if [ -n "$(git status --porcelain i18n/en.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add i18n/en.json
            git commit -m "Vertalingen bijgewerkt (automatisch) [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Geen nieuwe vertalingen."
          fi

      - name: Assemble site
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' \
                   --exclude 'i18n' --exclude 'README.md' --exclude '.gitignore' ./ _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
